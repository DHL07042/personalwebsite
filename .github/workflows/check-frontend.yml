name: Website frontend validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    name: Checked-out files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Serve the checked-out site
        run: |
          (python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
      - name: Validate the checked-out site
        env:
          BASE: http://127.0.0.1:8000/
          REPORT_DIR: browser-report-source
        run: python3 .github/scripts/check_frontend.py
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-source
          path: browser-report-source/
          retention-days: 7
  live-check:
    name: Deployed site
    if: github.event_name != 'pull_request'
    needs: source-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Validate the deployed site once the release is live
        env:
          BASE: https://daeholee.me/
          LIVE: "1"
          WAIT_SECONDS: "420"
          REPORT_DIR: browser-report-live
        run: python3 .github/scripts/check_frontend.py
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-live
          path: browser-report-live/
          retention-days: 7

name: Website frontend validation
on:
  push:
    paths: ['.github/workflows/check-frontend.yml']
  workflow_dispatch:
permissions: {}
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Validate live public website
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright
          base='https://daeholee.me/'
          expected='2026-10-14.3'
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base+'release.json?check='+str(time.time()),timeout=15) as r:
                      if json.load(r).get('release')==expected: break
              except Exception: pass
              time.sleep(5)
          else: raise SystemExit('Expected deployment not available; do not report success.')
          report={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'release':expected,'matrix':[],'checks':{},'pageerrors':[]}
          Path('browser-report').mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch()
              ctx=browser.new_context(viewport={'width':1440,'height':1000},color_scheme='dark')
              page=ctx.new_page()
              page.on('pageerror',lambda e:report['pageerrors'].append(str(e)))
              page.goto(base,wait_until='domcontentloaded')
              page.wait_for_selector('html.js')
              report['checks']['first_visit_follows_system']=page.get_attribute('html','data-theme') is None
              for width in [320,390,820,1440]:
                  page.set_viewport_size({'width':width,'height':1000})
                  for fn in ['index.html','research.html','publications.html','personal.html','contact.html']:
                      response=page.goto(base+fn,wait_until='domcontentloaded')
                      page.wait_for_selector('html.js')
                      for mode in ['light','dark']:
                          page.click('.theme-control button[data-theme-value="'+mode+'"]')
                          row=page.evaluate('''()=>({overflow:document.documentElement.scrollWidth>innerWidth+1,theme:document.documentElement.dataset.theme,bodyFont:getComputedStyle(document.body).fontSize,navFont:getComputedStyle(document.querySelector('.site-nav')).fontSize})''')
                          row.update(page=fn,width=width,mode=mode,status=response.status)
                          report['matrix'].append(row)
              page.goto(base,wait_until='domcontentloaded');page.click('.theme-control button[data-theme-value="dark"]');page.reload(wait_until='domcontentloaded');page.wait_for_selector('html.js')
              report['checks']['theme_reload']=page.get_attribute('html','data-theme')=='dark'
              page.goto(base+'research.html',wait_until='domcontentloaded');page.wait_for_selector('html.js')
              report['checks']['theme_across_pages']=page.get_attribute('html','data-theme')=='dark'
              page.click('.theme-control button[data-theme-value="system"]');page.emulate_media(color_scheme='light');page.wait_for_timeout(100)
              report['checks']['system_light']=page.get_attribute('html','data-theme')=='light'
              page.emulate_media(color_scheme='dark');page.wait_for_timeout(100)
              report['checks']['system_dark']=page.get_attribute('html','data-theme')=='dark'
              page.set_viewport_size({'width':390,'height':844});page.locator('.menu-toggle').click()
              report['checks']['mobile_menu_open']=page.get_attribute('#site-nav','data-open')=='true'
              page.keyboard.press('Escape');report['checks']['mobile_menu_escape']=page.get_attribute('#site-nav','data-open')=='false'
              page.locator('.menu-toggle').click();page.locator('#site-nav a[href="contact.html"]').click();page.wait_for_url('**/contact.html')
              report['checks']['mobile_link_navigation']=page.url.endswith('/contact.html')
              page.goto(base+'personal.html',wait_until='domcontentloaded')
              report['checks']['video_boxes_and_fallback_links']=page.locator('.yt').count()==3 and page.locator('a[href*="youtube.com/watch"]').count()==3
              report['video_sources']=page.locator('.yt').evaluate_all('(es)=>es.map(e=>({id:e.dataset.id,title:e.dataset.title,width:e.clientWidth,height:e.clientHeight}))')
              for name,width,fn,mode in [('desktop',1440,'index.html','light'),('phone',390,'index.html','light'),('dark',1440,'index.html','dark'),('media',1440,'personal.html','light')]:
                  page.set_viewport_size({'width':width,'height':1000});page.goto(base+fn,wait_until='domcontentloaded');page.click('.theme-control button[data-theme-value="'+mode+'"]');page.wait_for_timeout(500)
                  page.screenshot(path='browser-report/'+name+'.png',full_page=True)
              nc=browser.new_context(java_script_enabled=False,viewport={'width':390,'height':844});np=nc.new_page();np.goto(base,wait_until='domcontentloaded')
              report['checks']['no_js_nav_readable']=all(np.locator('#site-nav a').nth(i).is_visible() for i in range(5))
              report['checks']['no_js_no_overflow']=np.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
              browser.close()
          report['pass']=all(report['checks'].values()) and all(not r['overflow'] and r['status']==200 and r['theme']==r['mode'] for r in report['matrix']) and not report['pageerrors']
          report['limits']=['Chromium only, no physical devices.','Video boxes and original URLs checked; playback itself is not tested.','www TLS is diagnosed separately.']
          Path('browser-report/report.json').write_text(json.dumps(report,indent=2))
          print('BROWSER_REPORT_BEGIN');print(json.dumps(report,indent=2));print('BROWSER_REPORT_END')
          if not report['pass']: raise SystemExit('Frontend verification failed; inspect report.')
          PY
      - name: Upload screenshots and structured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-report
          path: browser-report/
          retention-days: 7

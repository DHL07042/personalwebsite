name: Stage public CV update
on:
  push:
    branches: ['gpt/cv-public-update-261015']
    paths: ['.github/workflows/stage-public-cv-update.yml']
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/gpt/cv-public-update-261015'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/cv-public-update-261015
      - name: Update only this review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'gpt/cv-public-update-261015'
          BEFORE=$(git rev-parse HEAD)
          python3 .github/scripts/stage_public_cv_update.py
          git rm .github/scripts/stage_public_cv_update.py
          git add index.html research.html publications.html personal.html contact.html release.json MAINTAINING.md public-cv.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add public CV entry points and 2024 honor; tighten study wording and attribution'
          test "$(git ls-remote origin refs/heads/gpt/cv-public-update-261015 | cut -f1)" = "$BEFORE"
          git push origin HEAD:refs/heads/gpt/cv-public-update-261015

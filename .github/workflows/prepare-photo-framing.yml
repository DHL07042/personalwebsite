name: Prepare photo framing review
on:
  push:
    branches: ['gpt/photo-framing-261018']
    paths: ['.github/workflows/prepare-photo-framing.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/gpt/photo-framing-261018'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/photo-framing-261018
          fetch-depth: 0
      - name: Inspect historical travel image dimensions
        run: |
          python3 -m pip install Pillow==11.3.0
          mkdir -p photo-audit
          python3 - <<'PY'
          import subprocess,json,io
          from pathlib import Path
          from PIL import Image
          rows=[]
          raw=subprocess.check_output(['git','rev-list','--objects','--all','--','assets']).decode()
          for entry in raw.splitlines():
              fields=entry.split(' ',1)
              if len(fields)!=2:continue
              sha,path=fields
              if 'travel' not in path.lower():continue
              try:
                  blob=subprocess.check_output(['git','cat-file','blob',sha],stderr=subprocess.DEVNULL)
                  im=Image.open(io.BytesIO(blob))
                  rows.append({'blob':sha,'path':path,'width':im.width,'height':im.height})
              except Exception:pass
          Path('photo-audit/history.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - name: Apply scoped display changes only
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          assert json.loads(Path('release.json').read_text())['release']=='2026-10-17.3'
          release='2026-10-18.1'
          for p in Path('.').glob('*.html'):
              p.write_text(p.read_text().replace('2026-10-17.3',release))
          p=Path('personal.html');s=p.read_text()
          assert s.count('<div class="gallery">')==1
          s=s.replace('<div class="gallery">','<div class="gallery photography-gallery" aria-label="Travel photographs">')
          s=s.replace('alt="Travel photograph 5" loading="lazy" width="800" height="800"','alt="Travel photograph 5" loading="lazy" width="513" height="513"')
          p.write_text(s)
          p=Path('styles.css');s=p.read_text().replace('2026-10-17.3',release)
          s+='''
          /* Photography is authored composition, not decorative card imagery.
             These rules preserve the supplied image bounds. They cannot recover
             content removed from an image file before it reached this repository. */
          .photography-gallery{align-items:start}
          .photography-gallery a{align-self:start;border:0;border-radius:0;overflow:visible;background:transparent}
          .photography-gallery img{display:block;width:100%;height:auto;aspect-ratio:auto;object-fit:contain;border-radius:0;transform:none;transition:none}
          .photography-gallery a:hover img{transform:none}
          .lightbox.photography-view img{flex:0 0 auto;width:auto;height:auto;max-width:100%;max-height:calc(100dvh - 128px);object-fit:contain;border-radius:0;background:transparent}
          '''
          p.write_text(s)
          p=Path('app.js');s=p.read_text()
          old="        openLb(a.getAttribute('href'),img?img.alt:'',cap?cap.textContent:'');"
          assert old in s
          s=s.replace(old,"        lb.classList.toggle('photography-view',!!a.closest('.photography-gallery'));\n"+old)
          old="lbImg.removeAttribute('src');"
          assert old in s
          s=s.replace(old,old+"lb.classList.remove('photography-view');")
          p.write_text(s)
          p=Path('release.json');d=json.loads(p.read_text());d['release']=release;p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('.github/scripts/check_review.py');s=p.read_text()
          s+='\nrunpy.run_path(str(Path(__file__).with_name("check_photo_framing.py")), run_name="__main__")\n';p.write_text(s)
          p=Path('MAINTAINING.md');s=p.read_text()
          s+='''

          ## Photography framing — pending source restoration (2026-10-18.1)
          - User correction supersedes any older rule to crop personal photography to square tiles. A photograph's frame and aspect ratio are part of its content.
          - Preserve the complete source composition in BOTH gallery preview and enlarged view. No square conversion, cover crop, hover zoom crop, or clipped corners. Arrange the layout around the images, not the reverse.
          - Image processing may reduce resolution or remove private metadata only after retaining an unmodified source locally; it must not trim, stretch, outpaint, retouch, or add unseen content without explicit approval.
          - Full-view links must point to uncropped source-framing renditions, not cropped thumbnails. Keep loading local and lazy; do not use external image requests to replace user photographs.
          - BLOCKER: travel-1.webp through travel-6.webp are already square-cropped files. Five are 800x800, travel-5 is 513x513. The code repair does NOT restore their missing edges. Obtain the six uncropped originals before marking this change ready or merged. Keep the existing files unchanged meanwhile.
          - Browser tests distinguish correct layout from source fidelity. The additional shape fixtures test portrait/landscape/panorama fitting; they are not replacement photographs. A passing test is not confirmation that the six source images have been restored.
          - Photography repair must not change the approved Performance driving paragraph, RI rows, CV, publication numbers, research images, or DNS.
          '''
          p.write_text(s)
          PY
          node --check app.js
          git add index.html research.html publications.html personal.html contact.html styles.css app.js release.json MAINTAINING.md .github/scripts/check_review.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve photo aspect ratios in gallery and lightbox; mark original source recovery pending'
          test "$(git ls-remote origin refs/heads/gpt/photo-framing-261018 | cut -f1)" = "$BEFORE"
          git push origin HEAD:refs/heads/gpt/photo-framing-261018
      - uses: actions/upload-artifact@v4
        with:
          name: photo-source-history
          path: photo-audit/
          retention-days: 7

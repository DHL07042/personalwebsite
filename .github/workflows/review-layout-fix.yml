name: Review enlarged-text layout
on:
  push:
    branches: ['gpt/site-review-261014']
    paths: ['.github/workflows/review-layout-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/gpt/site-review-261014'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/site-review-261014
      - name: Fix content styles without reducing text size
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('styles.css');s=p.read_text()
          marker='/* Enlarged-text reflow: preserve the normal one-line header and dates when they fit. */'
          assert marker not in s
          s+='\n'+marker+'\n.header-row{flex-wrap:wrap}\n.header-controls{max-width:100%;flex-wrap:wrap}\n.site-nav{min-width:0;flex-wrap:wrap}\n.facts dd .nowrap{display:inline-block;max-width:100%;white-space:normal;vertical-align:top}\n'
          p.write_text(s)
          p=Path('.github/scripts/check_review.py');s=p.read_text()
          old="row={'width':width,'page':fn,'overflow':page.evaluate('document.documentElement.scrollWidth>innerWidth+1')}"
          new="row={'width':width,'page':fn,'overflow':page.evaluate('document.documentElement.scrollWidth>innerWidth+1'),'offenders':page.evaluate(\"Array.from(document.querySelectorAll('body *')).filter(e=>e.getBoundingClientRect().right>innerWidth+1).slice(0,8).map(e=>({tag:e.tagName,cls:e.className,right:e.getBoundingClientRect().right}))\")}"
          assert old in s;s=s.replace(old,new);p.write_text(s)
          PY
          git add styles.css .github/scripts/check_review.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix header and date reflow at enlarged text sizes without shrinking typography'
          test "$(git ls-remote origin refs/heads/gpt/site-review-261014 | cut -f1)" = "$BEFORE"
          git push origin HEAD:refs/heads/gpt/site-review-261014

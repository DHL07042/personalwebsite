name: Prepare copy and RI review
on:
  push:
    branches: ['gpt/site-copy-ri-261017']
    paths: ['.github/workflows/prepare-copy-ri.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/gpt/site-copy-ri-261017'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/site-copy-ri-261017
      - name: Prepare text and layout without changing main or CV
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          BASE=6974109b755dfa6cb83d60cbd3b52450f1b2029a
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          old='2026-10-17.1';new='2026-10-17.3'
          assert json.loads(Path('release.json').read_text())['release']==old
          protected=['Daeho-Lee-CV.pdf','public-cv.json','CNAME','media-processing.json']
          hashes={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in protected}
          originals={n:Path(n).read_text() for n in ['index.html','personal.html','research.html','publications.html','contact.html']}
          def replace(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,(name,old[:90],s.count(old));p.write_text(s.replace(old,new))
          for name in originals:
              p=Path(name);p.write_text(p.read_text().replace(old,new))
          paragraph=('I’m drawn to the precision and physical feedback of circuit driving—feeling the chassis load up through the seat and steering wheel in high-g corners. '
                     'Through progressive on-track training (including the BMW M Intensive, Mercedes-AMG Performance, and HMG N Track Performance programs) '
                     'in limit handling, weight transfer, and low-grip car control, I’m steadily working my way from lead-follow sessions toward solo open-track driving.')
          article=('  <article class="project" id="performance-driving">\n'
                   '    <header>\n      <p class="eyebrow">Off duty</p>\n      <h2>Performance driving</h2>\n    </header>\n'
                   '    <div class="part prose">\n      <p>'+paragraph+'</p>\n    </div>\n  </article>')
          p=Path('personal.html');s=p.read_text();s,n=re.subn(r'  <article class="project" id="performance-driving">.*?</article>',lambda m:article,s,flags=re.S);assert n==1;p.write_text(s)
          rows=[('Physical human–robot interaction','coupled dynamics, compliance, and physical interfaces.'),('Perception-guided assistive control','intent inference amid reactive responses, and pre-contact sensing.'),('Biomechanical evaluation','interaction loads, locomotor performance, and human adaptation.')]
          def interests():
              r='  <section class="research-interests" id="research-interests" aria-labelledby="interests-title">\n    <h2 id="interests-title">Research interests</h2>\n    <p class="ri-scope">Wearable and legged robots</p>\n    <dl>\n'
              for title,detail in rows:r+='      <div class="ri-row"><dt>'+title+'</dt><dd>'+detail+'</dd></div>\n'
              return r+'    </dl>\n  </section>\n\n'
          replace('index.html','<p class="lede">I\u00a0work on sensing and control at the foot\u2060–\u2060ground and human\u2060–\u2060robot interfaces of wearable robots.</p>','<p class="lede">My research background is in sensing and experimental evaluation of wearable robots.</p>')
          replace('index.html','        <p>My research interests include gait‑phase estimation, contact‑aware load modulation, and human‑intention recognition in wearable robots. I\u00a0am also interested in sensing and control for legged locomotion.</p>\n','')
          replace('index.html','  <section class="section" aria-labelledby="research-title">',interests()+'  <section class="section" aria-labelledby="research-title">')
          replace('research.html','  <nav class="section-nav" aria-label="Projects">',interests()+'  <nav class="section-nav" aria-label="Projects">')
          oldmeta='Daeho Lee — researcher at the Agency for Defense Development; sensing and control at the foot\u2060–\u2060ground and human\u2060–\u2060robot interfaces of wearable robots, from KAIST’s Exo Lab.'
          newmeta='Daeho Lee — researcher at the Agency for Defense Development, with a background in wearable-robot sensing and experimental evaluation and research interests in wearable and legged robotics.'
          p=Path('index.html');s=p.read_text();assert s.count(oldmeta)==2;p.write_text(s.replace(oldmeta,newmeta))
          p=Path('styles.css');s=p.read_text()
          s=re.sub(r'/\* daeholee.me — site styles\. Release .*? \*/','/* daeholee.me — site styles. Release '+new+' */',s,count=1)
          s+='''\n/* Three research-interest rows; ordinary wrapping preserves readable type. */
          .research-interests{margin-top:clamp(28px,4vw,44px);padding-top:22px;border-top:1px solid var(--line)}
          .research-interests h2{font-size:1.2rem;line-height:1.35;letter-spacing:-.01em}
          .research-interests .ri-scope{margin-top:.35rem;color:var(--muted);font-size:var(--label);font-style:italic}
          .research-interests dl{margin-top:.85rem}
          .research-interests .ri-row{line-height:1.6;overflow-wrap:break-word;text-wrap:pretty}
          .research-interests .ri-row+.ri-row{margin-top:.55rem}
          .research-interests dt,.research-interests dd{display:inline;margin:0;font-size:var(--body)}
          .research-interests dt{font-weight:600;color:var(--ink)}
          .research-interests dd{font-weight:400;color:var(--ink-2)}
          .research-interests dd::before{content:" — ";font-weight:400}
          .page-head+.research-interests{margin-top:24px;padding-top:0;border-top:0}
          '''
          p.write_text(s)
          p=Path('release.json');d=json.loads(p.read_text());d['release']=new;p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('MAINTAINING.md');s=p.read_text()
          s,n=re.subn(r'^- Performance driving \(Personal page, release 2026-10-17\.1\).*$', '- Performance driving is an owner-written personal paragraph, not a training log. Preserve the title, physical-feedback description and inline "including ... programs" parenthesis. The named programs are examples, not an exhaustive list. Do not move them to a subtitle, chips or a separate courses list. No dates, lap times, telemetry percentages, skill rankings or "How I practice" block. Solo open-track driving is an aspiration, not a claimed completed qualification. Onboard media remains pending owner selection and permission checks.',s,flags=re.M);assert n==1
          s+='''\n## Copy and three-axis RI proposal (2026-10-17.3)
          - Home and Research use the same three ordered research-interest rows. The wearable/legged scope is an interest statement; the Home background remains wearable-robot sensing and evaluation, not a claim of completed legged-robot research.
          - Keep prior research cards, project order, figures, attribution and manuscript status intact. Interest in intent inference is not evidence of having solved intent/response separation.
          - Journal numbering is deliberately unchanged here. The owner selected oldest-first cumulative journal numbers while retaining newest-first display; migrate them with CV v0.992 and public-cv.json in a later reviewed change. Do not relabel publication anchors silently while the public CV still uses the old labels.
          - User-only editorial handoffs do not belong in this repository. Closing a PR or pruning a branch is not a substitute for correct records or any applicable authorship disclosures.
          '''
          p.write_text(s)
          p=Path('.github/scripts/check_review.py');s=p.read_text();assert "check_copy_ri.py" not in s;s+='\n# Editorial regressions are additive; existing checks remain unchanged.\nimport runpy\nrunpy.run_path(str(Path(__file__).with_name("check_copy_ri.py")), run_name="__main__")\n';p.write_text(s)
          assert all(hashlib.sha256(Path(n).read_bytes()).hexdigest()==h for n,h in hashes.items())
          for fn in ['research.html','index.html']:
              before=re.findall(r'\b[JCM T][1-5]\b',originals[fn]);after=re.findall(r'\b[JCM T][1-5]\b',Path(fn).read_text());assert before==after,fn
          for fn in ['publications.html','contact.html']:assert Path(fn).read_text()==originals[fn].replace(old,new)
          print('Prepared',new,'with CV, CNAME, media manifest and publication labels unchanged.')
          PY
          python3 -m py_compile .github/scripts/check_copy_ri.py .github/scripts/check_review.py
          git add index.html personal.html research.html publications.html contact.html styles.css release.json MAINTAINING.md .github/scripts/check_review.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve driving narrative and present research interests in three rows'
          test "$(git ls-remote origin refs/heads/gpt/site-copy-ri-261017 | cut -f1)" = "$BEFORE"
          git push origin HEAD:refs/heads/gpt/site-copy-ri-261017
      - name: Prepare review snapshot without font binaries
        run: |
          mkdir -p review-output
          python3 - <<'PY'
          import zipfile,subprocess
          from pathlib import Path
          with zipfile.ZipFile('review-output/source-no-fonts.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if n and Path(n).suffix.lower() not in {'.woff','.woff2','.ttf','.otf'}:z.write(n,n)
          Path('review-output/commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: copy-ri-source-no-fonts
          path: review-output/
          retention-days: 7

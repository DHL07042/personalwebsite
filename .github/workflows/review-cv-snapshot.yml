name: CV update review snapshot
on:
  push:
    branches: ['gpt/cv-public-update-261015']
    paths: ['.github/workflows/review-cv-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source for local review
        run: |
          mkdir -p review-output
          git archive --format=zip HEAD -o review-output/site-source.zip
          git rev-parse HEAD > review-output/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: site-source-review
          path: review-output/
          retention-days: 3

name: Restore owner photograph originals
on:
  push:
    branches: ['gpt/photo-framing-261018']
    paths: ['.github/workflows/restore-original-photographs.yml']
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/gpt/photo-framing-261018'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/photo-framing-261018
      - name: Transfer only files identical to the uploaded ZIP, then wire native-ratio images
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import urllib.request,hashlib,json,concurrent.futures,re
          # These are hashes and sizes of the six files actually extracted from
          # the owner's uploaded off duty_photography_original.zip.
          spec=[
           ('travel-1.jpg',1279,853,83680,'8bacbfc190cf51c3c85e65945f126f0b035090e5474cae0284d7e5aee4c872ce'),
           ('travel-2.jpg',1279,843,181656,'0453c085b98cdaa5fc62432a4e9e1e8265d10d260ac9224bc9b9ea34763a50b8'),
           ('travel-3.jpg',1280,832,205326,'813dfd9b844a09a8a43b010d7c8d5c16c915f416dde052bd7568c997a6c8c850'),
           ('travel-4.jpg',1280,848,386532,'d20c7657c40b75075a833922b0fb382a1639c2c269011a01d65a1f8c9a57f72c'),
           ('travel-5.jpg',768,513,140481,'fe9cc813f4ff42512cff74746bd181358b271f944dfee14dc9315397604e842a'),
           ('travel-6.jpg',1279,839,101685,'de13369080f5328b72b8b3e2db65848073f2ff614ef80c7fe1139de1fff9fdc9')]
          expected={x[4]:x for x in spec}
          def get(u):
            q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(q,timeout=20) as r:return r.read(16000000)
          class Images(HTMLParser):
            def __init__(self):super().__init__();self.urls=[]
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=='img' and a.get('src','').startswith('https://sites.google.com/sitesv-images-rt/'):
                self.urls.append(a['src'])
          # Transfer workaround only. No runtime dependency on the previous site.
          # No merely similar image is accepted: a source must match the owner ZIP byte-for-byte.
          parser=Images();parser.feed(get('https://sites.google.com/view/robotengdhl/personal-life-projects').decode('utf-8'))
          def match(u):
            try:
              b=get(u);h=hashlib.sha256(b).hexdigest()
              return (h,b) if h in expected and len(b)==expected[h][3] else None
            except Exception:return None
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            found={h:b for x in pool.map(match,parser.urls) if x for h,b in [x]}
          assert set(found)==set(expected), 'Cannot import: not all six files match the supplied originals exactly. No site changes committed.'
          dest=Path('assets/photos');dest.mkdir(exist_ok=True)
          entries=[]
          for name,w,h,n,sha in spec:
            target=dest/name;target.write_bytes(found[sha])
            entries.append({'id':name[:-4],'path':target.as_posix(),'width':w,'height':h,'bytes':n,'sha256':sha})
          manifest={'version':1,'as_of':'2026-10-18','source':'Owner-supplied off duty_photography_original.zip','source_restoration_complete':True,'processing':'None: byte-identical JPEG files; no crop, resize, rotation, re-encoding, retouching, or metadata rewriting.','photos':entries}
          Path('photography.json').write_text(json.dumps(manifest,indent=2)+'\n')
          alt=[
           'Deer-shaped silhouette between stone columns overlooking a hillside',
           'Pedestrian signal beside a narrow street and stone buildings',
           'Illuminated tower and bridge reflected in a river at dusk',
           'Ornate interior viewed upward with a circular chandelier',
           'Swan-shaped pedal boats on a lake',
           'Seagull perched above a waterfront cityscape']
          lines=['    <div class="gallery photography-gallery" aria-label="Travel photographs">']
          for row,text in zip(entries,alt):
            path=row['path'];w=row['width'];h=row['height']
            lines.append(f'      <a href="{path}" data-lightbox><img src="{path}" alt="{text}" loading="lazy" decoding="async" width="{w}" height="{h}"></a>')
          lines.append('    </div>')
          p=Path('personal.html');s=p.read_text()
          s,count=re.subn(r'    <div class="gallery photography-gallery"[^>]*>.*?    </div>', '\n'.join(lines),s,count=1,flags=re.S)
          assert count==1;p.write_text(s)
          p=Path('MAINTAINING.md');s=p.read_text()
          marker='## Photography framing — pending source restoration (2026-10-18.1)'
          assert marker in s
          s=s[:s.index(marker)]+'''## Photography framing — original sources restored (2026-10-18.1)
          - The six files under assets/photos are byte-identical to the owner's uploaded JPEGs. photography.json records their SHA-256 hashes, sizes, and native dimensions.
          - A photograph's frame and aspect ratio are part of its content. Preserve the whole image in BOTH gallery preview and enlarged view. No square conversion, cover crop, hover-zoom crop, clipped corners, arbitrary rotation, stretching, retouching, or generated expansion.
          - Preview and lightbox intentionally reference the same full-frame JPEG here: all six together are about 1.1 MB and are lazy-loaded. No smaller cropped thumbnail may ever become the enlarged image.
          - Preserve the supplied framing even for an unusual camera angle (including travel-4). Do not infer rotation from a scene's upright direction.
          - The old assets/img/travel-*.webp square crops remain as legacy files but are not used by the gallery. Do not reconnect them.
          - Future size optimization requires a separate, full-frame derivative and a traceable source. Verify its entire composition, not just its width/height ratio.
          - Browser checks verify full source-byte hashes, native dimensions, gallery/lightbox fitting, keyboard closure, responsive reflow and portrait/panorama fixtures. Fixtures test layout, not photo content.
          - Preserve Performance driving, RI rows, the CV, publication identifiers, research images, and DNS when editing this gallery.
          '''
          p.write_text(s)
          print(json.dumps({'restored':entries,'all_six_exact':True,'total_bytes':sum(x[3] for x in spec)},indent=2))
          PY
          git add assets/photos photography.json personal.html MAINTAINING.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore six original travel photographs byte-for-byte and preserve their full frames'
          test "$(git ls-remote origin refs/heads/gpt/photo-framing-261018 | cut -f1)" = "$BEFORE"
          git push origin HEAD:refs/heads/gpt/photo-framing-261018
      - uses: actions/upload-artifact@v4
        with:
          name: restored-photography-sources
          path: |
            assets/photos/
            photography.json
          retention-days: 7

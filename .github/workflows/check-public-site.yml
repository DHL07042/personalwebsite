name: Public website check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public DNS, pages, and HTTPS
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import socket
          import ssl
          import urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.title = ''
                  self.release = None
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'title':
                      self.in_title = True
                  if tag == 'meta' and attrs.get('name') == 'site-release':
                      self.release = attrs.get('content')
              def handle_endtag(self, tag):
                  if tag == 'title':
                      self.in_title = False
              def handle_data(self, data):
                  if self.in_title:
                      self.title += data

          report = {'checked_at_utc': datetime.now(timezone.utc).isoformat(), 'dns': [], 'http': []}
          for host in ['daeholee.me', 'www.daeholee.me', 'dhl07042.github.io']:
              row = {'host': host}
              try:
                  row['addresses'] = sorted({x[4][0] for x in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              except Exception as exc:
                  row['error'] = str(exc)
              report['dns'].append(row)
          core_urls = ['https://daeholee.me/' + path for path in ['', 'research.html', 'publications.html', 'personal.html', 'contact.html', 'styles.css', 'release.json']]
          other_urls = ['https://www.daeholee.me/', 'http://www.daeholee.me/', 'http://daeholee.me/', 'https://dhl07042.github.io/personalwebsite/']
          for url in core_urls + other_urls:
              row = {'url': url, 'core': url in core_urls}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'DaehoLee-PublicSiteCheck/1.0'})
                  with urllib.request.urlopen(request, timeout=15, context=ssl.create_default_context()) as response:
                      body = response.read(262144).decode('utf-8', errors='replace')
                      row.update(status=response.status, final_url=response.url, content_type=response.headers.get('Content-Type'), size=len(body))
                      if 'text/html' in row['content_type']:
                          parsed = PageParser()
                          parsed.feed(body)
                          row.update(title=parsed.title, release=parsed.release)
                      elif url.endswith('release.json'):
                          row['release'] = json.loads(body).get('release')
                      elif url.endswith('styles.css'):
                          row['has_expected_css'] = '.research-explore' in body and '.pager-card' in body
              except Exception as exc:
                  row['error'] = str(exc)
              report['http'].append(row)
          report['core_ok'] = all(x.get('status') == 200 and (x.get('release') == '2026-10-14.1' or x.get('has_expected_css') is True) for x in report['http'] if x['core'])
          print(json.dumps(report, indent=2))
          # www TLS and redirect findings are reported separately during cutover.
          if not report['core_ok']:
              raise SystemExit('At least one core page or asset did not match this release.')
          PY
